<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-sm space-y-6">
        <input 
            type="number" 
            id="w" 
            value="" 
            class="w-full bg-black border border-white text-center text-5xl font-bold py-4 text-white focus:outline-none focus:border-white rounded"
            style="border-radius: 20px;"
            oninput="c()"
            autofocus
        >

        <div class="border border-none divide-y divide-white-800">
            <div class="flex justify-between p-4 text-2xl font-bold"><span>130</span><span id="r130">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>140</span><span id="r140">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>150</span><span id="r150">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>160</span><span id="r160">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>170</span><span id="r170">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>180</span><span id="r180">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>190</span><span id="r190">0:00</span></div>
            <div class="flex justify-between p-4 text-2xl font-bold"><span>200</span><span id="r200">0:00</span></div>
        </div>
    </div>

    <script>
        const v = [130, 140, 150, 160, 170, 180, 190, 200];
        function c() {
            const n = parseFloat(document.getElementById('w').value) || 0;
            v.forEach(x => {
                const s = Math.round((n / x) * 60);
                const m = Math.floor(s / 60);
                const sec = String(s % 60).padStart(2, '0');
                document.getElementById('r' + x).textContent = m + ':' + sec;
            });
        }
        function s(x) {
            document.getElementById('w').value = x;
            c();
        }
        c();
    </script>
</body>
</html>
