<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理掌握</title>

    <!-- Leaflet.jsのCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet.markerclusterのCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        /* 基本スタイル */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* --- 検索ボックスのスタイル --- */
        #search-container {
            position: absolute;
            top: 10px;
            left: 53px;
            z-index: 1000;
            display: flex;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            background-clip: padding-box;
            background-color: #fff;
            height: 30px;
        }
        #search-input {
            border: none;
            padding: 0 10px;
            border-radius: 4px 0 0 4px;
            outline: none;
            width: 200px;
            background: transparent;
        }
        #search-button {
            height: 30px;
            width: 50px;
            border: none;
            border-left: 1px solid #ccc;
            border-radius: 0 4px 4px 0;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
        }
        #search-button:hover {
            background-color: #f4f4f4;
        }

        /* --- コントロールパネルのレイアウト調整 --- */
        .leaflet-control-layers-base label { padding-left: 6px; }
        #dark-mode-section { padding: 6px 10px 6px 6px; display: flex; align-items: center; }
        .leaflet-control-layers-separator { border-top: 1px solid #ddd; margin: 4px 0; }

        /* --- ライトモードのスタイル --- */
        body { background-color: #fff; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: white; color: #333; }
        .leaflet-tooltip { background: rgba(255, 255, 255, 0.9); border: 1px solid #ccc; color: #333; }
        .leaflet-control-layers, .leaflet-control-zoom a, .leaflet-control-attribution { background-color: #fff; color: #333; }
        
        /* --- ダークモードのスタイル --- */
        body.dark-mode { background-color: #222; }
        .dark-mode .leaflet-tile-pane { filter: invert(1) grayscale(1) brightness(1.2) contrast(1.1); }
        .dark-mode .leaflet-popup-content-wrapper, .dark-mode .leaflet-popup-tip { background: #2b2b2b; color: #f1f1f1; box-shadow: 0 3px 14px rgba(0,0,0,0.4); }
        .dark-mode .leaflet-tooltip { background: rgba(40, 40, 40, 0.9); border: 1px solid #555; color: #f1f1f1; }
        .dark-mode .leaflet-tooltip-top:before { border-top-color: #282828; }
        
        .dark-mode .leaflet-control-zoom { border: 2px solid #555; border-radius: 4px; }
        .dark-mode .leaflet-control-zoom a { background-color: #2b2b2b; color: #f1f1f1; border: none; }
        .dark-mode .leaflet-control-zoom a+a { border-top: 1px solid #555; }
        
        .dark-mode #search-container { background-color: #2b2b2b; border-color: #555; }
        .dark-mode #search-input { color: #f1f1f1; }
        .dark-mode #search-button { color: #f1f1f1; border-left-color: #555; }
        .dark-mode #search-button:hover { background-color: #3c3c3c; }

        .dark-mode .leaflet-control-layers, .dark-mode .leaflet-control-attribution { background-color: #2b2b2b; color: #f1f1f1; border-color: #555; }
        .dark-mode .leaflet-control-layers-selector, .dark-mode .leaflet-control-layers label { color: #f1f1f1; }
        .dark-mode .leaflet-control-layers-separator { border-top: 1px solid #555; }

        /* --- ポップアップを大きく表示するためのスタイル --- */
        .leaflet-popup-content-wrapper { border-radius: 5px; }
        .leaflet-popup-content { 
            min-width: 280px !important; 
            max-width: 350px !important; 
            font-size: 15px; 
            line-height: 1.7; 
            margin: 15px; 
            text-align: left;
        }
        .popup-title {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            text-align: center;
        }
        .dark-mode .popup-title { border-bottom-color: #555; }
        .leaflet-tooltip { border-radius: 3px; padding: 3px 6px; font-size: 12px; box-shadow: none; }

        @media (max-width: 768px) {
            #search-container {
                top: auto; left: auto;
                bottom: 30px; right: 10px;
            }
            #search-input { width: 150px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="search-container">
        <input type="text" id="search-input" placeholder="検索...">
        <button id="search-button">検索</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="cities.js"></script>

    <script>
        // 地図の初期設定
        const baseMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        });
        const map = L.map('map', { layers: [baseMap] }).setView([25, 40], 2);

        map.on('click', () => map.closePopup());

        // 都市のレイヤーグループを作成
        const layerGroups = {
            withLabel: L.markerClusterGroup({ maxClusterRadius: 40 }),
            noLabel: L.markerClusterGroup({ maxClusterRadius: 40 })
        };
        const popupOptions = { closeButton: false };

        // 各都市のマーカーを作成
        cities.forEach(city => {
            const { name, description, lat, lng } = city;
            
            const labelName = name.includes('｜') ? name.split('｜')[0] : name;
            
            const markerOptions = { radius: 6, fillColor: 'teal', color: "#fff", weight: 2, opacity: 0, fillOpacity: 0.9 };
            const popupContent = `<div class="popup-title">${name}</div><div>${description}</div>`;
            
            const markerWithLabel = L.circleMarker([lat, lng], markerOptions)
                .bindPopup(popupContent, popupOptions)
                .bindTooltip(labelName, { permanent: true, direction: 'top', offset: [0, -7], className: 'leaflet-tooltip' });
                
            // ラベルなしマーカー
            const markerNoLabel = L.circleMarker([lat, lng], markerOptions)
                .bindPopup(popupContent, popupOptions);
            
            addMarkerEvents(markerWithLabel);
            addMarkerEvents(markerNoLabel);
            
            layerGroups.withLabel.addLayer(markerWithLabel);
            layerGroups.noLabel.addLayer(markerNoLabel);
        });
        
        // デフォルトではラベルありを表示
        map.addLayer(layerGroups.noLabel);

        // UIコントロールパネル（レイヤー切り替え ＋ ダークモード）
        const baseLayers = { "ラベルあり": layerGroups.withLabel, "ラベルなし": layerGroups.noLabel };
        const layersControl = L.control.layers(baseLayers, null, { collapsed: false }).addTo(map);

        const controlContainer = layersControl.getContainer();
        const separator = document.createElement('div');
        separator.className = 'leaflet-control-layers-separator';
        controlContainer.prepend(separator);

        const darkModeContainer = document.createElement('div');
        darkModeContainer.id = 'dark-mode-section';
        darkModeContainer.innerHTML = `<input type="checkbox" id="dark-mode-toggle" style="margin-right: 5px; margin-left: 4px; cursor: pointer;"><label for="dark-mode-toggle" style="cursor: pointer;">ダークモード</label>`;
        controlContainer.prepend(darkModeContainer);

        // ダークモード切り替えイベント
        document.getElementById('dark-mode-toggle').addEventListener('change', function(e) {
            document.body.classList.toggle('dark-mode', e.target.checked);
        });

        // 検索機能
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        
        function searchCity() {
            const query = searchInput.value.trim();
            if (!query) return;
            const foundCity = cities.find(city => city.name.includes(query) || city.description.includes(query));

            if (foundCity) {
                const { lat, lng, name, description } = foundCity;
                map.flyTo([lat, lng], 5);
                const popupContent = `<div class="popup-title">${name}</div><div>${description}</div>`;
                L.popup(popupOptions).setLatLng([lat, lng]).setContent(popupContent).openOn(map);
            } else {
                alert('都市が見つかりませんでした。');
            }
        }
        
        searchButton.addEventListener('click', searchCity);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { searchCity(); }});

        // マウスホバーとクリックのイベント制御
        function addMarkerEvents(marker) {
            let closeTimeout; let isClicked = false;
            function openPopupWithLogic() { clearTimeout(closeTimeout); marker.openPopup(); }
            function closePopupWithLogic() { closeTimeout = setTimeout(() => { if (!isClicked) { marker.closePopup(); } }, 100); }
            
            marker.on('mouseover', openPopupWithLogic); 
            marker.on('mouseout', closePopupWithLogic);
            
            marker.on('popupopen', function () { 
                const popupEl = this.getPopup().getElement();
                if(popupEl) {
                    popupEl.addEventListener('mouseover', openPopupWithLogic); 
                    popupEl.addEventListener('mouseout', closePopupWithLogic); 
                }
            });
            
            marker.on('click', (e) => {
                isClicked = true;
                openPopupWithLogic();
                L.DomEvent.stop(e);
            });
            
            marker.on('popupclose', () => { isClicked = false; });
        }
    </script>
</body>
</html>
