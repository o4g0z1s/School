<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Browser</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background-color: #111;
      border-bottom: 1px solid #333;
      z-index: 10;
      transition: background-color 0.2s;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    form {
      display: flex;
      flex: 1;
      margin: 0 4px;
    }

    input[type="text"] {
      width: 100%;
      height: 32px;
      background-color: #000;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 12px;
      color: #eee;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border: 1.2px solid #777;
    }

    input[type="text"].drag-active {
      border: 1.2px solid #777;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #111;
      border: 1px solid #111;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      color: #888;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
      transition: all 0.15s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .btn:hover {
      background-color: #000;
      color: #eee;
      border-color: #333;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .material-symbols-outlined {
      font-size: 18px;
      line-height: 1;
    }

    main {
      flex: 1;
      position: relative;
      background-color: #000000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000000;
      transition: filter 0.3s ease;
      display: block;
    }

    iframe.inverted {
      filter: invert(1) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <header id="header-bar">
    <div class="btn-group">
      <button type="button" class="btn" id="reload-btn" aria-label="Reload">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>

    <form id="url-form">
      <input type="text" id="url-input" placeholder="https://" autocomplete="off" spellcheck="false">
    </form>

    <div class="btn-group">
      <button type="button" class="btn" id="invert-btn" aria-label="Invert">
        <span class="material-symbols-outlined">contrast</span>
      </button>
      <a class="btn" id="external-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open in Browser">
        <span class="material-symbols-outlined">open_in_new</span>
      </a>
    </div>
  </header>

  <main>
    <iframe id="viewer"></iframe>
  </main>

  <script>
    const BLACKLIST = ['o4g0z1s','lozdo','yahoo','wiki'];

    const header = document.getElementById('header-bar');
    const form = document.getElementById('url-form');
    const input = document.getElementById('url-input');
    const iframe = document.getElementById('viewer');
    
    const reloadBtn = document.getElementById('reload-btn');
    const invertBtn = document.getElementById('invert-btn');
    const externalLink = document.getElementById('external-link');

    let currentUrl = '';

    function isBlocked(url) {
      if (!url) return true;
      const lower = url.toLowerCase();
      return BLACKLIST.some(pattern => lower.includes(pattern.toLowerCase()));
    }

    function updateUrl(url) {
      currentUrl = url;
      input.value = url;
      externalLink.href = url;
    }

    function loadUrl(rawUrl) {
      let url = rawUrl.trim();
      if (!url) return;

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      if (isBlocked(url)) {
        return;
      }

      updateUrl(url);
      iframe.src = url;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      loadUrl(input.value);
    });

    let dragCounter = 0;

    header.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      input.classList.add('drag-active');
    });

    header.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      input.classList.add('drag-active');
    });

    header.addEventListener('dragleave', (e) => {
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        input.classList.remove('drag-active');
      }
    });

    header.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      input.classList.remove('drag-active');

      let droppedUrl = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');

      if (!droppedUrl) {
        const htmlData = e.dataTransfer.getData('text/html');
        if (htmlData) {
          const match = htmlData.match(/href=["'](https?:\/\/[^"']+)["']/i);
          if (match) droppedUrl = match[1];
        }
      }

      if (droppedUrl) {
        const target = droppedUrl.split('\n')[0].trim();
        loadUrl(target);
      }
    });

    window.addEventListener('dragover', (e) => {
      if (e.target.closest('#header-bar')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'none';
    });

    reloadBtn.addEventListener('click', () => {
      if (iframe.src) iframe.src = iframe.src;
    });

    invertBtn.addEventListener('click', () => {
      iframe.classList.toggle('inverted');
    });

    iframe.addEventListener('load', () => {
      try {
        const activeUrl = iframe.contentWindow.location.href;
        if (activeUrl && activeUrl !== 'about:blank' && !isBlocked(activeUrl)) {
          updateUrl(activeUrl);
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
